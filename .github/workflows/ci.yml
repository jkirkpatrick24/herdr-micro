name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}

    strategy:
      # Every leg reports, so a failure on one does not hide the others.
      fail-fast: false
      matrix:
        # Both platforms herdr-plugin.toml declares. node-hid resolves a
        # prebuild on each, so neither leg needs node-gyp or a toolchain; on
        # Linux that prebuild is the hidraw one, which is the backend this
        # daemon needs -- see the note in device.ts.
        os: [macos-latest, ubuntu-latest]
        # The floor declared in package.json engines, and the current LTS.
        node: ['22', '24']

    name: ${{ matrix.os }} / node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The checks AGENTS.md requires before a change is complete, in its order.
      - run: npm run check
      - run: npm run typecheck

      # tsconfig.build.json only: it narrows to the shipped sources and is the
      # one config that emits, so a module-boundary or packaging break shows up
      # here rather than at install time on someone's pad.
      - run: npm run build

      # test:coverage rather than test. It runs the same suite and additionally
      # enforces the thresholds in vitest.config.ts, so a coverage drop fails
      # the build instead of waiting to be noticed in a summary nobody reads.
      - run: npm run test:coverage
